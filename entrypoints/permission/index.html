<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Allow microphone · Zoya</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #070a14;
        color: #c9d2e6;
        font-family: system-ui, sans-serif;
      }
      main { max-width: 420px; padding: 24px; text-align: center; }
      h1 { margin: 0 0 12px; color: #fff; font-size: 34px; }
      p { line-height: 1.6; }
      button {
        margin-top: 16px;
        border: 0;
        border-radius: 999px;
        padding: 12px 24px;
        background: #2ee6d6;
        color: #04201d;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled { opacity: 0.4; cursor: default; }
      #status { min-height: 3em; color: #2ee6d6; }
    </style>
  </head>
  <body>
    <main>
      <h1>Let Zoya hear you</h1>
      <p>Chrome needs your OK once before Zoya can use the microphone. Press the button, then choose <strong>Allow</strong>.</p>
      <button id="allow" type="button">Allow microphone</button>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
